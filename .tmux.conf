## unbind and rebind -- source basically
unbind r
bind r source-file ~/.tmux.conf
## Tmux prefix change to Control + S 
## TIP - rebind CAPSLOCK to Control, who uses the CAPSLOCK anyway
set -g prefix C-s

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position top
#set -g default-terminal "xterm-256color"
# List of plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-boot 'on'

set -g @plugin 'dracula/tmux'

set -g @dracula-show-left-icon "\uf31a | #(whoami)@#h | #S"
set -g @dracula-plugins "network cpu-usage ram-usage weather time"
set -g @dracula-border-contrast true
set -g @dracula-day-month true
set -g @dracula-military-time true
set -g @dracula-show-fahrenheit false
set -g @dracula-show-location true 
set -g @dracula-battery-label false 
set -g @dracula-no-battery-label false 
set -g @dracula-show-powerline true

# for left
set -g @dracula-show-left-sep  

# for right symbol (can set any symbol you like as separator)
set -g @dracula-show-right-sep  

